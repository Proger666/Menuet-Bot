<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Квартира 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: the 3D apartment fills the screen under a living sky; controls are small frosted islands at the safe-area edges, icons instead of words. */
:root {
  --ink: #1c292b;
  --ink-2: #566668;
  --ink-3: #8a999a;
  --glass: rgba(250, 250, 247, .78);
  --glass-m: rgba(250, 250, 247, .94);
  --glass-solid: #fbfbf8;
  --line: rgba(28, 41, 43, .1);
  --chip: rgba(28, 41, 43, .06);
  --chip-hover: rgba(28, 41, 43, .11);
  --accent: #2a6a5d;
  --accent-soft: rgba(42, 106, 93, .14);
  --accent-ink: #ffffff;
  --danger: #c0473d;
  --sky-top: #d8e2e4;
  --sky-bottom: #efede6;
  --shadow: 0 14px 34px rgba(18, 30, 32, .18), 0 2px 6px rgba(18, 30, 32, .08);
  --font-ui: "Onest", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.2, .9, .25, 1);
  --spring: cubic-bezier(.34, 1.45, .55, 1);
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8eeec; --ink-2: #a7b6b3; --ink-3: #74837f;
    --glass: rgba(24, 31, 33, .74); --glass-m: rgba(24, 31, 33, .93); --glass-solid: #1c2325;
    --line: rgba(255, 255, 255, .1); --chip: rgba(255, 255, 255, .07); --chip-hover: rgba(255, 255, 255, .13);
    --accent: #6cc3ad; --accent-soft: rgba(108, 195, 173, .18); --accent-ink: #0c1a17;
    --danger: #ec8278; --sky-top: #1a2225; --sky-bottom: #2b3335;
    --shadow: 0 14px 34px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e8eeec; --ink-2: #a7b6b3; --ink-3: #74837f;
  --glass: rgba(24, 31, 33, .74); --glass-m: rgba(24, 31, 33, .93); --glass-solid: #1c2325;
  --line: rgba(255, 255, 255, .1); --chip: rgba(255, 255, 255, .07); --chip-hover: rgba(255, 255, 255, .13);
  --accent: #6cc3ad; --accent-soft: rgba(108, 195, 173, .18); --accent-ink: #0c1a17;
  --danger: #ec8278; --sky-top: #1a2225; --sky-bottom: #2b3335;
  --shadow: 0 14px 34px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--sky-bottom); color: var(--ink); font: 14px/1.35 var(--font-ui);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* stage: sky, stars, sun glow, then the 3D canvas */
#stage { position: fixed; inset: 0; background: radial-gradient(130% 90% at 50% 0%, var(--sky-top), var(--sky-bottom) 70%); overflow: hidden; }
.stars { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.stars canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.stars.on canvas + canvas { animation: twinkle 3.6s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .15; } to { opacity: 1; } }
.celestial { position: absolute; left: 0; top: 0; width: 70vmin; height: 70vmin; margin: -35vmin 0 0 -35vmin; border-radius: 50%; pointer-events: none; opacity: 0; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(8, 14, 20, .2)); }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.rlabel {
  position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: none;
  padding: 3px 8px 3px; border-radius: 999px; background: var(--glass); color: var(--ink);
  font-size: 10.5px; font-weight: 600; letter-spacing: .04em; box-shadow: 0 2px 10px rgba(0,0,0,.1);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: opacity .35s var(--ease);
}
.ripple {
  position: fixed; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%;
  border: 3px solid currentColor; pointer-events: none; animation: ripple .65s var(--ease) forwards; z-index: 30;
}
@keyframes ripple { from { transform: scale(.15); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }

.glass {
  background: var(--glass); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: var(--shadow); border: 1px solid var(--line);
}
/* phones: blur over a live 3D canvas is expensive, so the panels are simply more opaque */
body.mobile .glass, body.mobile .rlabel { background: var(--glass-m); -webkit-backdrop-filter: none; backdrop-filter: none; }
.act[hidden] { display: none; }

/* top bar */
.topbar {
  position: fixed; left: 0; right: 0; top: 0; z-index: 20; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) var(--gutter-r) 0 var(--gutter-l);
  display: flex; align-items: center; gap: 8px;
}
.topbar > * { pointer-events: auto; }
.orb { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex: none; transition: transform .25s var(--spring), opacity .25s, color .25s, background .25s; }
.orb:active { transform: scale(.88); }
.orb[disabled] { opacity: .4; pointer-events: none; }
.orbs { display: flex; gap: 2px; padding: 3px; border-radius: 999px; flex: none; }
.orbs .orb { width: 40px; height: 40px; border: 0; box-shadow: none; background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
.orbs .orb.on { background: var(--accent-soft); color: var(--accent); }

/* time ribbon: drag the sun across the day */
.sky { position: relative; flex: 1; min-width: 0; height: 46px; border-radius: 999px; overflow: hidden; touch-action: none; cursor: ew-resize; padding: 0; }
.sky canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sky::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -8px 16px rgba(0,0,0,.08); pointer-events: none; }
.knob {
  position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; pointer-events: none; z-index: 2;
  background: radial-gradient(circle at 38% 36%, #fffdf0, #ffd666 52%, #ffab3d);
  box-shadow: 0 0 0 3px rgba(255, 224, 140, .35), 0 0 18px 6px rgba(255, 196, 90, .65);
  transition: background .8s, box-shadow .8s;
}
.knob::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #1d2a44; transform: translate(6px, -4px) scale(.82); opacity: 0; transition: opacity .8s; }
.sky.night .knob { background: radial-gradient(circle at 36% 34%, #ffffff, #d6ddf5 70%); box-shadow: 0 0 0 3px rgba(200, 214, 255, .2), 0 0 16px 5px rgba(170, 190, 255, .5); }
.sky.night .knob::after { opacity: 1; }
.bubble {
  position: fixed; z-index: 25; left: 0; top: 0; padding: 5px 10px; border-radius: 999px; font-weight: 700; font-size: 13px;
  font-variant-numeric: tabular-nums; pointer-events: none; opacity: 0; transform: translate(-50%, 6px) scale(.9);
  transition: opacity .2s, transform .3s var(--spring);
}
.bubble.on { opacity: 1; transform: translate(-50%, 0) scale(1); }

/* tab bar with a sliding indicator */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 22; pointer-events: none;
  padding: 0 var(--gutter-r) calc(env(safe-area-inset-bottom, 0px) + 12px) var(--gutter-l);
  display: flex; justify-content: center;
}
.tabs { pointer-events: auto; position: relative; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; border-radius: 999px; width: min(100%, 320px); }
.tabpill { position: absolute; top: 6px; bottom: 6px; left: 0; width: 0; border-radius: 999px; background: var(--accent); opacity: 0; transform: scale(.6);
  transition: left .5s var(--spring), width .5s var(--spring), opacity .25s, transform .45s var(--spring); }
.tabpill.on { opacity: 1; transform: none; }
.tab { position: relative; z-index: 1; height: 50px; display: grid; place-items: center; border-radius: 999px; color: var(--ink-2); transition: color .3s; }
.tab .ico { width: 25px; height: 25px; transition: transform .45s var(--spring); }
.tab:active .ico { transform: scale(.85); }
.tab.on { color: var(--accent-ink); }
.tab.on .ico { transform: scale(1.08); }

/* bottom sheet */
.sheet {
  position: fixed; z-index: 21; left: var(--gutter-l); right: var(--gutter-r);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 86px);
  margin: 0 auto; max-width: 520px; border-radius: 28px; overflow: hidden;
  transform: translateY(calc(100% + 120px)) scale(.96); opacity: 0; visibility: hidden;
  transition: transform .5s var(--ease), opacity .3s, visibility 0s .5s;
}
.sheet.open { transform: none; opacity: 1; visibility: visible; transition: transform .5s var(--spring), opacity .25s, visibility 0s; }
.sheet.dragging { transition: none; }
.grab { display: block; width: 100%; height: 22px; position: relative; touch-action: none; cursor: grab; }
.grab::before { content: ""; position: absolute; left: 50%; top: 9px; width: 38px; height: 5px; margin-left: -19px; border-radius: 9px; background: var(--chip-hover); }
.sheet-body { max-height: min(42vh, 380px); overflow-y: auto; overscroll-behavior: contain; padding: 0 14px 16px; -webkit-overflow-scrolling: touch; scrollbar-width: none; transition: height .45s var(--ease); }
.sheet-body::-webkit-scrollbar { display: none; }
.panel { display: none; flex-direction: column; gap: 14px; }
.panel.on { display: flex; animation: panelIn .45s var(--ease) both; }
@keyframes panelIn { from { opacity: 0; transform: translateX(calc(var(--dir, 0) * 28px)) translateY(calc((1 - var(--dir, 0) * var(--dir, 0)) * 10px)); } to { opacity: 1; transform: none; } }

/* icon segmented rows */
.iseg { position: relative; display: flex; gap: 2px; padding: 4px; border-radius: 18px; background: var(--chip); }
.iseg button { position: relative; z-index: 1; flex: 1; height: 42px; min-width: 40px; display: grid; place-items: center; border-radius: 14px; color: var(--ink-2); transition: color .3s, transform .25s var(--spring); }
.iseg button:active { transform: scale(.9); }
.iseg button.on { color: var(--ink); }
.iseg .segpill { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 14px; background: var(--glass-solid); box-shadow: 0 2px 8px rgba(0,0,0,.12); transition: left .45s var(--spring), width .45s var(--spring); }
.row { display: flex; align-items: center; gap: 10px; }
.row > .grow { flex: 1; min-width: 0; }

.catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
.card {
  position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 20px; overflow: hidden;
  background: radial-gradient(circle at 50% 35%, var(--glass-solid), var(--chip) 75%);
  box-shadow: inset 0 0 0 1px var(--line); transition: transform .3s var(--spring), box-shadow .2s;
  animation: cardIn .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 28ms);
}
@keyframes cardIn { from { opacity: 0; transform: translateY(10px) scale(.94); } to { opacity: 1; transform: none; } }
.card:active { transform: scale(.92); }
.card img { position: absolute; inset: 6%; width: 88%; height: 88%; object-fit: contain; opacity: 0; transform: scale(.8) rotate(-4deg); transition: opacity .45s, transform .6s var(--spring); }
.card img.ready { opacity: 1; transform: none; }
.card::after { content: ""; position: absolute; inset: auto 22% 9px; height: 6px; border-radius: 50%; background: rgba(0,0,0,.12); filter: blur(3px); }

.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 9px; }
.sw {
  aspect-ratio: 1; max-width: 100%; border-radius: 50%; position: relative;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.1), inset 0 -6px 10px rgba(0,0,0,.08), inset 0 4px 6px rgba(255,255,255,.35);
  transition: transform .3s var(--spring);
}
.sw:active { transform: scale(.85); }
.sw.on { transform: scale(1.08); }
.sw.on::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2.5px solid var(--accent); animation: pop .4s var(--spring); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.sw.custom { background: conic-gradient(#e57373, #ffd54f, #81c784, #4fc3f7, #9575cd, #e57373); overflow: visible; }
.sw.custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border-radius: 50%; }
#wallSwatches { grid-template-columns: repeat(9, 1fr); gap: 7px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; }
.tiles.strip { display: flex; overflow-x: auto; margin: 0 -14px; padding: 4px 14px 6px; scrollbar-width: none; }
.tiles.strip::-webkit-scrollbar { display: none; }
.tiles.strip .tile { flex: none; width: 62px; }
.tile {
  position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 18px; background-size: 180%; background-position: center;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08), 0 3px 10px rgba(0,0,0,.08); transition: transform .3s var(--spring);
  animation: cardIn .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 25ms);
}
.tile:active { transform: scale(.9); }
.tile.on::after { content: ""; position: absolute; inset: -5px; border-radius: 22px; border: 2.5px solid var(--accent); animation: pop .4s var(--spring); }
.brush { width: 42px; height: 42px; border-radius: 50%; flex: none; background-size: 220%; background-position: center; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1), 0 4px 12px rgba(0,0,0,.15); transition: background-color .4s; }

.minimap { width: 100%; max-width: 100%; height: auto; max-height: 168px; display: block; border-radius: 20px; background: var(--chip); padding: 8px; }
.minimap .room { cursor: pointer; transition: fill .5s, opacity .2s; }
.minimap .wl { stroke: var(--ink); stroke-opacity: .6; stroke-width: .12; stroke-linecap: round; pointer-events: none; }
.minimap .room:active { opacity: .7; }
.minimap .furn { fill: var(--ink); fill-opacity: .2; pointer-events: none; }
.minimap .win { stroke: #6fb4d6; stroke-width: .16; stroke-linecap: round; pointer-events: none; }
.minimap .gap { stroke: var(--glass-solid); stroke-width: .16; pointer-events: none; }
.minimap .camw { fill: var(--accent); fill-opacity: .28; }
.minimap .camd { fill: var(--accent); }
.toggles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.tg { aspect-ratio: 1; max-width: 100%; border-radius: 16px; display: grid; place-items: center; background: var(--chip); color: var(--ink-3); transition: background .3s, color .3s, transform .3s var(--spring); }
.tg:active { transform: scale(.88); }
.tg.on { background: var(--accent-soft); color: var(--accent); }
.tg.danger { color: var(--danger); }
.tilt { display: flex; align-items: center; gap: 10px; color: var(--ink-3); }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 30px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 6px; background: var(--chip-hover); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 6px; background: var(--chip-hover); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -9px; border-radius: 50%; background: var(--glass-solid); box-shadow: 0 2px 8px rgba(0,0,0,.25), inset 0 0 0 6px var(--accent); }
input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border: 0; border-radius: 50%; background: var(--glass-solid); box-shadow: 0 2px 8px rgba(0,0,0,.25), inset 0 0 0 6px var(--accent); }

/* selection bar */
.selbar {
  position: fixed; z-index: 23; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 88px);
  width: min(calc(100% - 32px), 400px); border-radius: 26px; padding: 7px;
  transform: translate(-50%, 30px) scale(.9); opacity: 0; visibility: hidden; pointer-events: none;
  transition: transform .45s var(--spring), opacity .25s, visibility 0s .45s, box-shadow .3s;
}
.selbar.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; pointer-events: auto; transition: transform .5s var(--spring), opacity .25s, visibility 0s, box-shadow .3s; }
.selbar.warn { box-shadow: var(--shadow), 0 0 0 2px var(--danger); }
.selbar .top { display: flex; align-items: center; gap: 4px; }
.selthumb { position: relative; width: 50px; height: 50px; flex: none; border-radius: 19px; background: radial-gradient(circle at 50% 35%, var(--glass-solid), var(--chip) 80%); display: grid; place-items: center; margin-right: auto; }
.selthumb img { width: 46px; height: 46px; object-fit: contain; }
.selthumb .badge { position: absolute; right: -3px; top: -3px; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: #fff; display: grid; place-items: center; transform: scale(0); transition: transform .35s var(--spring); }
.selbar.warn .selthumb .badge { transform: scale(1); }
.selbar .badge svg { width: 12px; height: 12px; stroke-width: 3; }
.act { width: 46px; height: 46px; border-radius: 17px; display: grid; place-items: center; transition: background .2s, transform .25s var(--spring), color .2s; }
.act:active { transform: scale(.86); }
.act.on { background: var(--accent-soft); color: var(--accent); }
.act.danger { color: var(--danger); }
.colorpop { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease); }
.colorpop.on { grid-template-rows: 1fr; }
.colorpop > div { overflow: hidden; }
.cprow { display: flex; align-items: flex-start; gap: 10px; padding: 10px 6px 4px; }
.cprow .slot { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); }
.cprow .slot .ico { width: 18px; height: 18px; }
.cprow .swatches { flex: 1; grid-template-columns: repeat(auto-fill, minmax(28px, 1fr)); gap: 7px; }

.ghost { position: fixed; left: 0; top: 0; z-index: 60; width: 58px; height: 58px; margin: -29px 0 0 -29px; pointer-events: none; }
.ghost i { position: absolute; inset: 0; border-radius: 50% 50% 50% 7px; transform: rotate(-45deg); background-size: 220%; background-position: center;
  box-shadow: 0 14px 28px rgba(0,0,0,.34), inset 0 0 0 3px rgba(255,255,255,.92), inset 0 -10px 14px rgba(0,0,0,.12); animation: ghostIn .35s var(--spring) both; transition: transform .3s var(--spring), opacity .25s; }
.ghost.hit i { transform: rotate(-45deg) scale(1.16); }
.ghost.out i { transform: rotate(-45deg) scale(.2); opacity: 0; }
@keyframes ghostIn { from { transform: rotate(-45deg) scale(.3); opacity: 0; } }
.sheet.open.peek { transform: translateY(calc(100% - 70px)) scale(.97); opacity: .5; transition: transform .45s var(--ease), opacity .3s; }
.selbar.show.peek { transform: translate(-50%, 40px) scale(.95); opacity: .45; }
.toast {
  position: fixed; z-index: 40; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 68px);
  transform: translate(-50%, -14px) scale(.92); opacity: 0; pointer-events: none; transition: transform .45s var(--spring), opacity .25s;
  border-radius: 999px; padding: 6px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
  max-width: calc(100% - 32px);
}
.toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast .msg { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 4px; min-height: 34px; }
.toast .dot { width: 28px; height: 28px; border-radius: 50%; flex: none; background-size: 200%; background-position: center; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
.toast .msg .ico { width: 20px; height: 20px; }
.toast button { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.toast button .ico { width: 18px; height: 18px; }
.toast button[hidden] { display: none; }

/* first-run gestures */
.hello {
  position: fixed; z-index: 45; inset: 0; display: grid; place-items: center; padding: 24px var(--gutter-r) 24px var(--gutter-l);
  background: rgba(10, 18, 20, .3); opacity: 0; visibility: hidden; transition: opacity .4s, visibility 0s .4s;
}
.hello.show { opacity: 1; visibility: visible; transition: opacity .4s; }
.hello .box { border-radius: 30px; padding: 18px; width: min(100%, 360px); display: flex; flex-direction: column; gap: 14px; background: var(--glass-solid); transform: translateY(18px) scale(.95); transition: transform .6s var(--spring); }
.hello.show .box { transform: none; }
.gestures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.gest { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--ink-2); text-align: center; }
.gest .stage { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 22px; background: var(--chip); overflow: hidden; }
.gest .f { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px var(--accent-soft); left: 50%; top: 50%; }
.g1 .f { animation: g1 2.2s var(--ease) infinite; }
@keyframes g1 { 0%, 10% { transform: translateX(-22px); } 50%, 60% { transform: translateX(22px); } 100% { transform: translateX(-22px); } }
.g2 .f:nth-child(1) { animation: g2a 2.2s var(--ease) infinite; }
.g2 .f:nth-child(2) { animation: g2b 2.2s var(--ease) infinite; }
@keyframes g2a { 0%, 15% { transform: translate(-8px, 8px); } 55%, 70% { transform: translate(-26px, 26px); } 100% { transform: translate(-8px, 8px); } }
@keyframes g2b { 0%, 15% { transform: translate(8px, -8px); } 55%, 70% { transform: translate(26px, -26px); } 100% { transform: translate(8px, -8px); } }
.g3 .box3 { position: absolute; left: 50%; top: 50%; width: 34px; height: 24px; margin: -12px 0 0 -17px; border-radius: 7px; background: #c9a77c; box-shadow: 0 6px 10px rgba(0,0,0,.18); animation: g3b 2.6s var(--ease) infinite; }
.g3 .f { animation: g3f 2.6s var(--ease) infinite; }
.g3 .f::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid var(--accent); animation: g3r 2.6s var(--ease) infinite; }
@keyframes g3f { 0%, 45% { transform: translate(-16px, 0); } 85%, 100% { transform: translate(16px, -10px); } }
@keyframes g3b { 0%, 35% { transform: translate(-16px, 0) scale(1); } 45% { transform: translate(-16px, -3px) scale(1.12); } 85%, 100% { transform: translate(16px, -13px) scale(1.12); } }
@keyframes g3r { 0% { transform: scale(.4); opacity: 0; } 20% { opacity: 1; } 40% { transform: scale(1.2); opacity: 0; } 100% { opacity: 0; } }
.hello .go { height: 52px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }

.loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50; background: var(--sky-bottom); transition: opacity .7s, visibility 0s .7s; }
.loading.done { opacity: 0; visibility: hidden; }
.ld { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 28px; max-width: 360px; text-align: center; }
.ldlogo { position: relative; width: 120px; height: 120px; display: grid; place-items: center; color: var(--accent); margin-bottom: 8px; }
.ldlogo > svg:first-child { width: 58px; height: 58px; }
.ldlogo > svg:first-child path { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 1.6s var(--ease) infinite alternate; }
.ldring { position: absolute; inset: 0; width: 120px; height: 120px; transform: rotate(-90deg); }
.ldring circle { fill: none; stroke-width: 4; stroke: var(--chip-hover); }
.ldring circle + circle { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 95; transition: stroke-dashoffset .5s var(--ease); }
.ldstep { margin: 0; font-size: 16px; font-weight: 600; color: var(--ink); min-height: 1.4em; animation: panelIn .4s var(--ease); }
.ldpct { margin: 0; font-size: 12px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.ldwhy { margin: 6px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--ink-2); text-wrap: balance; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.loading .err { margin: 6px 0 0; font: 500 13px var(--font-ui); color: var(--danger); max-width: 300px; text-align: center; }
.loading .err:empty { display: none; }
@media (prefers-reduced-motion: reduce) {

}

    geo.applyMatrix4(o.matrixWorld);
    if (geo.index) geo = geo.toNonIndexed();
    if (!buckets.has(o.material)) buckets.set(o.material, []);
    buckets.get(o.material).push(geo);

  const out = new T.Group();
  for (const [mat, geos] of buckets) {
    let n = 0; geos.forEach((q) => { n += q.attributes.position.count; });
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), uv = new Float32Array(n * 2);
    let o3 = 0, o2 = 0;

      pos.set(q.attributes.position.array, o3); nor.set(q.attributes.normal.array, o3);
      if (q.attributes.uv) uv.set(q.attributes.uv.array, o2);
      o3 += q.attributes.position.count * 3; o2 += q.attributes.position.count * 2;
      q.dispose();
    }
    const geo = new T.BufferGeometry();
    geo.setAttribute('position', new T.BufferAttribute(pos, 3));
    geo.setAttribute('normal', new T.BufferAttribute(nor, 3));
    geo.setAttribute('uv', new T.BufferAttribute(uv, 2));
    geo.computeBoundingSphere(); geo.computeBoundingBox();
    const m = new T.Mesh(geo, mat);
    m.castShadow = !mat.transparent; m.receiveShadow = true;

}
